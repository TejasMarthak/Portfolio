services:
  - type: web
    name: portfolio-api
    runtime: node
    buildCommand: npm ci --omit=dev --workspace=@portfolio-system/server --include-workspace-root=false
    startCommand: node server/server.js
    healthCheckPath: /ping
    plan: starter
    disk:
      name: whatsapp-auth
      mountPath: /app/whatsapp-auth
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: YOUR_WHATSAPP_JID
        sync: false
      - key: PRO_CLIENT_URL
        sync: false
      - key: PHOTO_CLIENT_URL
        sync: false
      - key: ADMIN_CLIENT_URL
        sync: false
